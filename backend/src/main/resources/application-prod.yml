# ============================================================
# 「懒得想」LazyThink — 生产环境配置（模板）
# ============================================================
# ⚠️ 此文件不提交Git（已在.gitignore中排除）
# ⚠️ 所有敏感信息必须通过环境变量注入，禁止硬编码
# ============================================================

spring:
  datasource:
    # [必须改] 生产MySQL地址，通过环境变量注入
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/lazythink?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai
    # [必须改] 生产MySQL用户名，通过环境变量 MYSQL_USER 注入
    username: ${MYSQL_USER}
    # [必须改] 生产MySQL密码，通过环境变量 MYSQL_PASSWORD 注入
    password: ${MYSQL_PASSWORD}
    hikari:
      # 连接池大小（2C4G服务器推荐值）
      maximum-pool-size: 20
      minimum-idle: 5

mybatis-plus:
  configuration:
    # 生产环境关闭SQL日志
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
